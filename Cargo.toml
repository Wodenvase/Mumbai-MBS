[package]
name = "mbs_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mbs_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-polars = "0.11"
polars = { version = "0.35", features = ["lazy", "temporal", "strings", "csv"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[build-dependencies]
pyo3-build-config = "0.20"
